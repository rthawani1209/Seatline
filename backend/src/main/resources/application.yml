spring:
  application:
    name: seatline-api
  datasource:
    url: ${SEATLINE_DB_URL:jdbc:postgresql://localhost:5432/seatline}
    username: ${SEATLINE_DB_USER:seatline}
    password: ${SEATLINE_DB_PASSWORD:seatline}
  data:
    redis:
      url: ${SEATLINE_REDIS_URL:redis://localhost:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true

server:
  # Behind the load balancer every request arrives from its address. "native" makes Tomcat take
  # the client address from X-Forwarded-For, but only when the request came from a private-network
  # address (the balancer), so the internet can't fake it. Login rate limits depend on this.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

seatline:
  # 32+ random bytes, base64. Required outside development; see SecurityConfig.
  jwt-secret: ${SEATLINE_JWT_SECRET:}
  token-ttl: 1h
  # client ports of the seat ledger nodes
  ledger: ${SEATLINE_LEDGER:1=localhost:8001,2=localhost:8002,3=localhost:8003}
  ledger-timeout: 5s
  # the nodes' admin addresses (peer ports, nodes started with --admin) for the chaos panel;
  # leave unset to turn the panel off
  ledger-admin: ${SEATLINE_LEDGER_ADMIN:}
  # the web app, for links in emails
  public-url: ${SEATLINE_PUBLIC_URL:http://localhost:3000}
  # mutual TLS with the ledger; set all three in a deployment (files from scripts/certs.sh)
  # ledger-tls:
  #   cert: ${SEATLINE_LEDGER_TLS_CERT}
  #   key: ${SEATLINE_LEDGER_TLS_KEY}
  #   ca: ${SEATLINE_LEDGER_TLS_CA}
