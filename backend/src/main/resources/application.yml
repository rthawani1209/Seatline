spring:
  application:
    name: seatline-api
  jackson:
    deserialization:
      # every amount is whole cents; 1.5 is a mistake to refuse, not a 1 to sell at
      accept-float-as-int: false
    mapper:
      # and "3" is a string, not a number
      allow-coercion-of-scalars: false
  datasource:
    url: ${SEATLINE_DB_URL:jdbc:postgresql://localhost:5432/seatline}
    username: ${SEATLINE_DB_USER:seatline}
    password: ${SEATLINE_DB_PASSWORD:seatline}
    hikari:
      maximum-pool-size: ${SEATLINE_DB_POOL:20}
      # in a rush, tell the fan to try again after a few seconds rather than hang for 30
      connection-timeout: 5000 # ms
  data:
    redis:
      url: ${SEATLINE_REDIS_URL:redis://localhost:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
  # set only in a deployment: then OutboxSender sends the emails in the outbox
  mail:
    host: ${SEATLINE_SMTP_HOST:}
    port: ${SEATLINE_SMTP_PORT:587}
    username: ${SEATLINE_SMTP_USER:}
    password: ${SEATLINE_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000

server:
  # Behind the load balancer every request arrives from its address. "native" makes Tomcat take
  # the client address from X-Forwarded-For, but only when the request came from a private-network
  # address (the balancer), so the internet can't fake it. Login rate limits depend on this.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

seatline:
  # true in a real deployment: missing secrets stop the API from starting instead of being made up
  production: ${SEATLINE_PRODUCTION:false}
  mail-from: ${SEATLINE_MAIL_FROM:Seatline <no-reply@localhost>}
  # 32+ random bytes, base64. Required when production is true; see SecurityConfig.
  jwt-secret: ${SEATLINE_JWT_SECRET:}
  token-ttl: 1h
  # client ports of the seat ledger nodes
  ledger: ${SEATLINE_LEDGER:1=localhost:8001,2=localhost:8002,3=localhost:8003}
  ledger-timeout: 5s
  # how long one read of an event's seat map is shared between fans polling it
  seat-map-cache-ms: ${SEATLINE_SEAT_MAP_CACHE_MS:500}
  # the nodes' admin addresses (peer ports, nodes started with --admin) for the chaos panel;
  # leave unset to turn the panel off
  ledger-admin: ${SEATLINE_LEDGER_ADMIN:}
  # this email's account becomes an admin when it sets its password from a reset link (the first
  # admin on a new server)
  admin-email: ${SEATLINE_ADMIN_EMAIL:}
  # the web app, for links in emails
  public-url: ${SEATLINE_PUBLIC_URL:http://localhost:3000}
  # mutual TLS with the ledger; set all three in a deployment (files from scripts/certs.sh)
  # ledger-tls:
  #   cert: ${SEATLINE_LEDGER_TLS_CERT}
  #   key: ${SEATLINE_LEDGER_TLS_KEY}
  #   ca: ${SEATLINE_LEDGER_TLS_CA}
