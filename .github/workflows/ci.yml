name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Long simulation run
        run: mvn -B -pl ledger test -Dtest=RandomizedSafetyTest -Dseatline.sim.runs=2000
      - name: Seat chaos run (1,000 seeds, every history checked for linearizability)
        run: mvn -B -pl ledger test -Dtest=SeatChaosTest -Dseatline.chaos.runs=1000

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    needs: [ledger, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start the whole stack
        run: docker compose up -d --build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install test tools
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Wait for the API
        run: |
          for i in $(seq 1 90); do
            curl -sf localhost:3000/api/events >/dev/null && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: Browser tests
        working-directory: frontend
        run: npx playwright test
      - name: Logs
        if: failure()
        run: docker compose logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
